name: Backend CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies (also downloads the test mongod binary)
        run: npm ci --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (unit, HTTP, MongoDB replica-set integration, deployment config)
        run: npm test
      - run: npm run build
      - name: Dependency audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Validate Railway Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build Railway Docker image
        run: docker build --tag mini-payment-server:ci .
      - name: Validate image with synthetic Railway configuration (no live services)
        run: |
          docker run --rm \
            -e NODE_ENV=production -e APP_ENV=production -e TRUST_PROXY_HOPS=1 \
            -e CORS_ORIGINS=https://maheshpcse.github.io \
            -e MONGODB_URI='mongodb+srv://ci.example.mongodb.net/mini_payment' \
            -e REDIS_URL=redis://redis.ci.internal:6379 \
            mini-payment-server:ci node dist/scripts/deploy-check.js
          if docker run --rm -e NODE_ENV=production -e MONGODB_URI=mongodb://localhost:27017/x -e REDIS_URL=redis://localhost:6379 \
            mini-payment-server:ci node dist/scripts/deploy-check.js; then
            echo "deploy-check accepted a local configuration" && exit 1
          fi
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Deployment handoff
        run: |
          {
            echo '### Backend validation'
            echo 'Tests and the Railway Docker image passed. No production credentials are used by this workflow.'
            echo 'Deploy with Railway GitHub autodeploy (enable **Wait for CI**) or run the **Deploy to Railway** workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
